# Managed by scout (UI / `scout strategy`). Query bank + bio search + watchlist + github topics.
#
# Written in X advanced-search syntax so the free twscrape source keeps its full
# operator set; scout/ingest/xapi_src.py translates filter:X to the v2 has:/is:
# spelling and drops min_faves: (no v2 equivalent) before any paid request.
#
# Three rules every paid query follows:
#
# 1. PARENTHESISE EVERY OR-GROUP. Implicit AND binds tighter than OR, so
#    `"a" OR "b" C OR D` parses as `"a" OR ("b" AND C) OR D` and a post
#    containing only D matches. Ungrouped ORs quietly widen the net to
#    everything, and on a paid endpoint you buy every one of those results.
#
# 2. EXCLUDE NOISE IN THE QUERY, NOT IN SCORING. thesis.yaml disqualifiers run
#    after the post has been fetched and billed. A -term in the query costs
#    nothing and is never read. Every disqualifier that can move upstream should.
#
# 3. PREFER NARROW. Cost is per result returned, so a narrow query that matches
#    three posts costs $0.045, not the $0.30 page ceiling. Precision lowers the
#    bill and raises the hit rate at the same time — there is no trade here.
#
# The shared company-page core:
#   filter:links      a company announcing itself links to its site or product
#   -filter:replies   replies are where the volume and the noise live
#   -filter:retweets  amplification duplicates cost the same as originals
#   -filter:quote     quote-tweets are commentary about launches, not launches
# plus first-person-plural phrasing ("we're building", "our model"), which is how
# company accounts speak and individuals mostly don't. The author of a matching
# post IS the company account we want, and the search response expands it (bio,
# website, follower counts) at no extra charge.
lists: []
searches: []
searches_departure:
- '("started a company" OR "co-founded" OR "our new company") (AI OR model OR "machine learning") filter:links -filter:replies -filter:retweets -filter:quote -crypto -web3 -NFT -airdrop -giveaway -webinar -newsletter -"link in bio" min_faves:10'
- '("YC W26" OR "YC S26" OR "Y Combinator" OR "backed by") (AI OR model OR "machine learning") filter:links -filter:replies -filter:retweets -filter:quote -crypto -web3 -NFT -airdrop -giveaway -webinar -newsletter -"link in bio" min_faves:10'
