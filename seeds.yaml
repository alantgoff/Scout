# Seed strategies (v2 — research-backed query bank). Editable here or in `scout ui`.
#
# Syntax notes:
#   - Engagement filters (min_faves:) and bio: operators work in twscrape mode only;
#     the paid X API silently drops or rejects them (scout strips them in xapi mode).
#   - Quote exact phrases; OR must be uppercase; () group.

# --- Departure announcements (earliest, highest-recall signal) --------------
searches_departure:
  - '"some personal news" (openai OR anthropic OR deepmind OR "google brain" OR xai) min_faves:30'
  - '("my last day at" OR "last day at" OR "leaving") (@OpenAI OR @AnthropicAI OR @GoogleDeepMind OR @xai) min_faves:20'
  - '("after" ("years at" OR "years working at")) (openai OR anthropic OR deepmind) min_faves:20'

# --- Stealth / new-venture intent -------------------------------------------
searches_stealth_intent:
  - '"building something new" (ai OR agents OR infra OR devtools) min_faves:10'
  - '("in stealth" OR "going stealth") (ai OR agents OR infra OR evals)'
  - '"working on something" (ai OR llm OR agents) min_faves:10'

# --- Founding-team hiring (a founder hiring reveals themselves) --------------
searches_hiring:
  - '("founding engineer" OR "founding team" OR "employee #1") (hiring OR "we''re hiring" OR join) (ai OR llm OR agents OR infra)'

# --- Just-launched announcements (target_stages: launched) --------------------
searches_launch:
  - '("we just launched" OR "today we''re launching" OR "we''re live") (ai OR agents OR llm OR infra OR devtools) min_faves:20'
  - '"coming out of stealth" (ai OR agents OR infra)'
  - '("launch day" OR "launching today") (ai OR agents OR devtools) min_faves:10'
  - '"Show HN" (agents OR llm OR ai) min_faves:10'

# --- Legacy catch-all (still run, uncategorized) -----------------------------
searches: []

# --- Bio / people search (twscrape search_user; finds accounts by BIO text) --
bio_searches:
  - "ex-openai"
  - "ex-anthropic"
  - "ex-deepmind"
  - "stealth ai"
  - "building ai infra"

