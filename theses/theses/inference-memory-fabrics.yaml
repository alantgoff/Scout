id: inference-memory-fabrics
name: Inference Memory Fabrics
thesis: 'Generative AI is pivoting from training to production inference, and raw token generation is
  commoditising toward $0.10/M. The defensible returns are in infrastructure that solves the MEMORY-BANDWIDTH
  bottleneck for autonomous agents, long-context retrieval and compound AI systems: disaggregated prefill/decode
  across heterogeneous clusters, CXL memory fabrics that pool across nodes, KV-cache as a persistent tiered
  asset, agent-aware cache topologies (TTL pinning, differential sibling storage, trie/radix memory),
  4-bit numerics with algorithmic corrections that keep reasoning accuracy (stochastic rounding, Random
  Hadamard Transforms, asymmetric formatbooks), and dynamic multi-LoRA compression and scheduling. Value
  capture is moving from the models to the memory orchestration and algorithmic optimisation layers.'
