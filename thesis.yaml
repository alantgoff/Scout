# Managed by scout (UI / `scout strategy`). target_stages steers search + scoring;
# signal_params and llm_prompt are editable in the UI.
thesis: Identify technical founders building hardware or software infrastructure that enables AI model
  deployment at the edge — inference, orchestration, networking, and silicon — outside centralized cloud
  data centers.
keywords:
- edge inference
- on-device AI
- edge deployment
- embedded ML
- TinyML
- edge computing
- neuromorphic
- edge orchestration
- inference at the edge
- building edge
target_bios:
- ex-Qualcomm
- ex-NVIDIA
- prev @nvidia
- ex-Apple Silicon
- prev @apple
- ex-Arm
- ex-Intel
- prev @intel
- ex-Google Edge
- ex-Graphcore
- prev @graphcore
- ex-Cerebras
sectors:
- edge AI hardware
- edge AI software
- on-device inference
- embedded machine learning
- edge orchestration
- AI silicon / custom chips
- edge networking and connectivity
- TinyML
- edge MLOps
disqualifiers:
- crypto
- NFT
- blockchain
- web3
- recruiter
- marketing
- consultant
- analyst
- student
weights:
  bio_intent: 20.0
  smart_money_convergence: 20.0
  departure_signal: 20.0
  bio_change: 10.0
  smart_money_follow: 10.0
  launch_traction: 10.0
  builder_evidence: 5.0
  github_evidence: 5.0
  source_corroboration: 5.0
launch_phrases:
- just launched
- we're live
- announcing our
- introducing our edge
- shipping today
- open sourcing our
- now available on-device
target_stages:
- idea
- stealth
- launched
signal_params:
  traction_floor: 0.05
  traction_saturation: 0.25
  traction_window_days: 30
  convergence_full_credit: 2
  stage_mismatch_multiplier: 0.5
  thesis_fit_weight: 0.5
  value_add_weight: 0.0
firm_name: Headline
firm_value_add:
- key: global_expansion
  label: Local-to-global expansion
  description: Autonomous local funds in the US, Europe, Latin America, and Asia connected into one global
    platform — startups whose product or go-to-market must cross borders early (multi-region customers,
    US↔EU expansion, international marketplaces) get on-the-ground help in each market.
- key: follow_on_capital
  label: Multi-stage follow-on capital
  description: Early-stage checks of $1.5–15M chain into an $865M growth fund writing $20–70M from Series
    B — startups on capital-intensive trajectories (infra buildout, GPU spend, market-by-market expansion)
    that will need deep follow-on rounds benefit most.
- key: data_driven_growth
  label: Data-driven growth benchmarking
  description: Proprietary systems (EVA sourcing, ATHENA analytics, Searchlight, the founder-facing Deepdive)
    benchmark traction, retention, and product-market fit against one of the largest startup datasets
    in venture — startups with measurable usage or revenue metrics (consumer, marketplaces, usage-based
    SaaS, PLG devtools) can be benchmarked and coached with it.
- key: sector_playbooks
  label: Sector depth & portfolio network
  description: Operator networks and repeat playbooks in fintech, commerce/consumer, B2B SaaS, and AI
    infrastructure (portfolio includes Mistral AI, NGINX, Sonos, Bumble, Gopuff, Acorns, Raisin) — startups
    in these lanes tap portfolio intros, customer pipelines, and hiring networks.
llm_prompt: ''
