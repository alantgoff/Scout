  - lora
  - peft
  - gpu-computing
  - high-performance-computing
  - cxl
  - rdma
  - memory-management
  - mlsys

# --- arXiv --------------------------------------------------------------------
# THE thesis-specific call. cs.DC/cs.AR/cs.PF are where the disaggregated
# serving, CXL fabric and memory-hierarchy work actually lands; math.NA and
# cs.MS carry the quantization-numerics work (stochastic rounding, Hadamard
# transforms). Keeping only the default ML categories would miss most of the
# population this thesis describes.
arxiv_categories:
  - cs.DC   # distributed/parallel/cluster — disaggregated prefill+decode
  - cs.AR   # hardware architecture — CXL, memory fabrics, accelerators
  - cs.PF   # performance — the bottleneck framing of the whole thesis
  - cs.LG   # still needed: serving and quantization papers land here too
  - cs.MS   # mathematical software — kernel and numerics implementations
  - math.NA # numerical analysis — rounding, stability, transforms
  - cs.OS   # operating systems — the "virtual memory management" founder profile

