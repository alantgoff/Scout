# Sourcing config for the Inference Memory Fabrics thesis.
#
# The important decision here is the arXiv category set. The defaults
# (cs.LG / cs.AI / cs.CL / cs.MA) are ML-research categories, and this thesis
# is not about models — it is about memory physics, interconnects, numerics
# and kernels. The people it wants publish in cs.DC, cs.AR and cs.PF, and
# would be almost entirely invisible under the default sweep.

lists: []

# --- X query bank -------------------------------------------------------------
# Mechanism-level, because "AI inference" as a query returns the API-wrapper
# market this thesis explicitly rejects.

searches_departure:
  - '"leaving NVIDIA" (inference OR kernels OR CUDA)'
  - '"left NVIDIA" building'
  - '(ex-NVIDIA OR "prev NVIDIA") (inference OR CUDA OR kernel)'
  - '("leaving OpenAI" OR "leaving Anthropic") (infrastructure OR inference OR systems)'
  - '"leaving DeepMind" (systems OR infrastructure)'
  - '(vLLM OR SGLang OR TensorRT) "starting something"'
  - '"Hazy Research" (founding OR "starting a company")'
  - 'LMSYS (founding OR "new company")'

searches_stealth_intent:
  - '"in stealth" (inference OR "KV cache" OR CUDA OR quantization)'
  - '"building something new" (GPU OR inference OR memory OR kernels)'
  - '"stealth" ("memory bandwidth" OR "prefill" OR "decode")'
  - '"day 1" (inference OR "ML systems")'
  - '(founder OR "co-founder") ("KV cache" OR "paged attention" OR CXL)'

searches_hiring:
  - '"founding engineer" (CUDA OR kernels OR inference)'
  - '"hiring" "systems engineer" (inference OR "KV cache")'
  - '"first engineer" (GPU OR "ML systems" OR compiler)'
  - '"looking for a co-founder" (CUDA OR inference OR HPC)'

searches_launch:
  - '(open-sourcing OR "open sourced") ("KV cache" OR "inference engine")'
  - '"faster inference" (benchmark OR throughput) -API'
  - '("prefill" AND "decode") (disaggregat OR separate)'
  - 'CXL (memory pooling OR fabric) launch'
  - '(MXFP4 OR "4-bit") (accuracy OR reasoning OR quantization)'
  - '"multi-LoRA" (serving OR throughput OR batching)'

