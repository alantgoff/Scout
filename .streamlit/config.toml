[server]
headless = true
port = 8501
address = "localhost"

[browser]
gatherUsageStats = false

[theme]
# Committed light appearance (Headline design language, headline.com) — one
# deterministic look on every machine; native widgets share the same warm
# cream/ink palette as the custom CSS.
base = "light"
primaryColor = "#20180f"
backgroundColor = "#f4ebe0"
secondaryBackgroundColor = "#fbf5ec"
textColor = "#20180f"
